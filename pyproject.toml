[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pbz-editor"
version = "0.3.4"
description = "Offline inventory and save editor for Phantom Blade Zero"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "cryptography>=43", "texture2ddecoder==1.0.6"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
pbz-editor = "pbz_editor.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["pbz_editor*"]

[tool.setuptools.package-data]
pbz_editor = ["assets/*.svg", "locales/*.json"]
